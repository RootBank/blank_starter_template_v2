# Worked example: a batch, file-based debit-order bureau.
#
# ACME DEBIT BUREAU IS NOT A REAL PROVIDER. It stands in for the South African
# debit-order bureaux this template's file-based path exists for, and it is here
# to break the assumption that every provider looks like Stripe. Specifically it
# is: webhook-less, batch rather than per-payment, asynchronous by days rather
# than milliseconds, and reached over SFTP rather than HTTPS.
#
# Citations. Because the provider is illustrative, its provider-side facts have
# no document to cite, and the spec says so rather than inventing one: those
# fields carry `kind: inferred` with a TODO(human) question, which is what a
# real spec should look like at the point the author has not yet read the
# bureau's file-layout document. Everything that comes from this repo is cited
# as `kind: document` and can be confirmed with grep. `npm run spec:validate`
# passes with warnings; `--strict` fails it, which is the correct outcome for a
# spec with unanswered questions in it.

spec_version: 1

provider:
  name: Acme Debit Bureau
  slug: acme-debit-bureau
  api_type: file

integration:
  collection_model: batch_file
  status_source: response_file
  currencies: [ZAR]
  amount_unit: minor
  supports_refunds: false

auth:
  type: sftp_key
  config_key: providerSftpPrivateKey
  notes: >-
    Key-pair authentication to the bureau's SFTP host. There is no bearer token
    and no per-request credential: the connection is the authentication, which
    is why this block has no header or format.
  source:
    kind: inferred
    rationale: >-
      Debit-order bureaux in this market exchange files over SFTP with key-pair
      auth, but the credential model has to come from the bureau's own onboarding
      pack rather than from a public API reference.
    todo: 'TODO(human): Does the bureau authenticate by SSH key pair alone, or does it also require a per-file PGP signature?'

idempotency:
  required: true
  mechanism: natural_key
  key_source: root_payment_id
  notes: >-
    The Root payment id is written into the user reference field of each debit
    record. A resubmitted file is deduplicated by the bureau on that reference,
    so a redelivered submission does not debit twice. This is the whole reason
    idempotency is a top-level block rather than an HTTP concern.
  source:
    kind: inferred
    rationale: >-
      Deduplication on a user reference is the usual bureau behaviour, but
      whether it is enforced or merely advisory decides whether the module has to
      keep its own submitted-payments ledger.
    todo: 'TODO(human): Does the bureau reject a duplicate user reference outright, or silently accept and debit twice?'

file_exchange:
  submission:
    transport: sftp
    host_config_key: providerSftpHost
    path_pattern: '/outgoing/DEBIT-{YYYYMMDD}-{seq}.txt'
    format: fixed_width
    cutoff_time_utc: '14:00'
    max_records_per_file: 5000
    notes: >-
      One file per collection day. A file arriving after the cutoff is processed
      on the next banking day, which is why latest_submission_time_utc below is
      set earlier than this.

  response:
    transport: sftp
    host_config_key: providerSftpHost
    path_pattern: '/incoming/RESP-{YYYYMMDD}-{seq}.txt'
    format: fixed_width
    available_after: 'Two banking days after the collection date.'
    notes: >-
      Unpaid results arrive later than paid ones. A payment with no response
      line is still in flight, not successful, so absence must never be read as
      success.

  record_layout:
    reference: 'Acme Bureau file layout, section 4 (fixed-width debit record).'
    notes: >-
      Not modelled field by field here. The layout belongs in the provider doc;
      this spec records only that one exists and that it is fixed-width.

status_reports:
  mechanism: response_file
  schedule: 'Daily at 06:00 UTC, reading the previous banking day''s response file.'
  codes:
    - code: '00'
      meaning: Accepted and settled.
      provider_status: settled
      applies_to: response_file_code
      source:
        kind: inferred
        rationale: >-
          Response codes are the single most consequential thing in this spec:
          they decide whether a policyholder is marked paid. They must be read
          from the bureau's code table, not assumed from convention.
        todo: 'TODO(human): Please confirm each response code against the bureau code table — which code means settled?'

    - code: '04'
      meaning: Unpaid, insufficient funds in the account.
      provider_status: unpaid_insufficient_funds
      applies_to: response_file_code
      source:
        kind: inferred
        rationale: >-
          Insufficient funds is the one unpaid reason that should be retried, so
          mapping it to the wrong code either loses revenue or hammers an account
          that will never pay.
        todo: 'TODO(human): Which response code is insufficient funds, and is it distinct from a general unpaid code?'

    - code: '10'
      meaning: Unpaid, the account is closed.
      provider_status: unpaid_account_closed
      applies_to: response_file_code
      source:
        kind: inferred
        rationale: >-
          A closed account must block the payment method rather than retry, so
          this code has to be distinguished from a transient unpaid.
        todo: 'TODO(human): Which response codes are permanent account failures that must block the payment method?'

    - code: '30'
      meaning: The account holder disputed the debit order.
      provider_status: disputed
      applies_to: response_file_code
      source:
        kind: inferred
        rationale: >-
          A dispute has regulatory consequences beyond a failed payment and must
          not be collapsed into an ordinary unpaid.
        todo: 'TODO(human): Which response code signals a disputed debit, and what is the bureau''s re-presentation rule after one?'

    - code: PE
      meaning: Submitted and awaiting action at the bank.
      provider_status: pending_submission
      applies_to: response_file_code
      source:
        kind: inferred
        rationale: >-
          An interim code is what stops the module reading a not-yet-final line
          as a failure.
        todo: 'TODO(human): Does the bureau emit an interim pending code, or do records only appear once final?'

status_map:
  - provider_status: pending_submission
    applies_to: response_file_code
    root_status: submitted
    terminal: false
    source:
      kind: document
      title: Root Platform node SDK
      locator: '@rootplatform/node-sdk lib/root-sdk-openapi.d.ts, enum PaymentStatus'
      quote: 'Submitted = "submitted",'
      retrieved: '2026-10-19'

  - provider_status: settled
    applies_to: response_file_code
    root_status: successful
    terminal: true
    source:
      kind: document
      title: Root Platform node SDK
      locator: '@rootplatform/node-sdk lib/root-sdk-openapi.d.ts, enum PaymentStatus'
      quote: 'Successful = "successful",'
      retrieved: '2026-10-19'

  - provider_status: unpaid_insufficient_funds
    applies_to: response_file_code
    root_status: failed
    failure_action: allow_retry
    terminal: false
    source:
      kind: document
      title: Collection module template
      locator: docs/17-SCHEDULED-PAYMENTS.md § retry
      quote: '`backoffMultiplier` compounds: the first retry waits `backoffDays`'
      retrieved: '2026-10-19'

  - provider_status: unpaid_account_closed
    applies_to: response_file_code
    root_status: failed
    failure_action: block_payment_method
    terminal: true
    source:
      kind: document
      title: Root Platform node SDK
      locator: '@rootplatform/node-sdk lib/root-sdk-openapi.d.ts, enum FailureAction'
      quote: 'BlockPaymentMethod = "block_payment_method",'
      retrieved: '2026-10-19'

  - provider_status: disputed
    applies_to: response_file_code
    root_status: failed
    failure_action: block_retry
    terminal: true
    source:
      kind: document
      title: Root Platform node SDK
      locator: '@rootplatform/node-sdk lib/root-sdk-openapi.d.ts, enum FailureAction'
      quote: 'BlockRetry = "block_retry",'
      retrieved: '2026-10-19'

config_fields:
  - name: providerSftpPrivateKey
    storage: extra
    description: PEM private key used for SFTP key-pair authentication to the bureau.
    secret: true
    required: true

  - name: providerSftpHost
    storage: extra
    description: Hostname of the bureau's SFTP endpoint.
    example: sftp.example-bureau.test
    secret: false
    required: true

  - name: providerSecretKey
    storage: standard
    description: >-
      Bureau service-user identifier written into each file header. Carried in
      the standard field so no provider-named config key is introduced.
    example: ACME00123
    secret: true
    required: true

lifecycle_hooks:
  renderCreatePaymentMethod:
    behaviour: >-
      Return the HTML form that captures bank account number, branch code and
      account type. There is no provider-hosted page and no tokenisation step.
    idempotency: >-
      Pure render, no side effect. Safe to call any number of times.

  createPaymentMethod:
    behaviour: >-
      Validate the submitted account number and branch code and store them on
      the Root payment method. Nothing is sent to the bureau at this point: a
      mandate only exists once the first debit is presented.
    idempotency: >-
      Validation and storage only, no external call, so repeated invocations
      converge on the same stored payment method.

  afterPolicyIssued:
    behaviour: >-
      Return schedule_payment actions for the policy's forecast premiums. The
      platform turns each into a pending payment and batches it on the due date.
      Nothing is called on the bureau here.
    actions: [schedule_payment]
    idempotency: >-
      Root may redeliver this hook. Returning the same schedule_payment actions
      for the same billing periods is the intended behaviour; the platform owns
      the schedule and reconciles rather than appending duplicates.

  afterPolicyCancelled:
    behaviour: >-
      Return unschedule_payment for every future collection on the policy. A
      debit already written into today's file cannot be recalled, so the hook
      must not assume the next collection is still cancellable.
    actions: [unschedule_payment]
    idempotency: >-
      Unscheduling an already-unscheduled payment is a no-op on the platform
      side, so a redelivered cancellation is safe.

billing_settings:
  batching:
    enabled: false
    schedule_time_utc: '05:00'
    submission_lead_time: 2
    latest_submission_time_utc: '13:30'
  retry:
    max_attempts: 2
    backoff_days: 3
    backoff_multiplier: 1

error_scenarios:
  - scenario: The SFTP host refused the connection at submission time.
    module_error: NetworkError
    handling: >-
      Retry through retryWithBackoff before the cutoff. If the cutoff passes
      without a successful upload, leave the payments scheduled rather than
      marking them failed, and alert.
    retryable: true

  - scenario: The response file contains a code that is not in the status map.
    module_error: ValidationError
    handling: >-
      Do not guess. Leave the payment in its current state, log the unmapped
      code with the payment reference, and alert so the code table can be
      extended deliberately.
    retryable: false

  - scenario: A debit record was rejected by the bureau at file level, before reaching the bank.
    provider_error_code: REJ
    module_error: ValidationError
    handling: >-
      Mark the payment failed with block_payment_method, because a file-level
      rejection means the stored account details are malformed and every future
      attempt will fail the same way.
    retryable: false
    root_payment_status: failed
    failure_action: block_payment_method

deviations:
  - id: DEV-001
    rule: webhooks
    summary: The bureau sends no webhooks. Payment outcomes arrive in a daily response file.
    rationale: >-
      There is no callback channel at all, so the signature, payload and event
      blocks the template assumes have nothing to describe. Status reconciliation
      is a scheduled read of an SFTP directory instead.
    code_marker: 'DEVIATION: Provider has no webhooks. Scheduled response-file reader at code/services/response-file.service.ts reconciles payment state.'
    files:
      - code/services/response-file.service.ts
      - code/webhook-hooks.ts
    provider_doc: 'docs/providers/acme-debit-bureau.md#deviations-from-template'
    pr_note: >-
      This provider has no webhooks; webhook-hooks.ts stays a stub and state is
      reconciled from the daily response file instead. Flagging it so a reviewer
      can challenge the scheduled-read approach.

  - id: DEV-002
    rule: provider_interface
    summary: PaymentProviderService has no slot for submitting a batch or reading a response file.
    rationale: >-
      Every method on the interface is a single-entity synchronous call:
      createCustomer, createPaymentIntent, attachPaymentMethod. A bureau has no
      customer object and no per-payment charge call. docs/17-SCHEDULED-PAYMENTS.md
      already writes `providerService.charge(...)` in its submitPayments example,
      which is also not on the interface, so the gap is not specific to this
      provider. Raising it rather than widening the interface quietly.
    code_marker: 'DEVIATION: No PaymentProviderService method fits a batch file submission. Batch assembly lives in code/services/debit-batch.service.ts and is invoked by the platform batcher, not by the provider service.'
    files:
      - code/services/debit-batch.service.ts
    provider_doc: 'docs/providers/acme-debit-bureau.md#deviations-from-template'
    pr_note: >-
      Batch assembly does not implement PaymentProviderService because no method
      on it fits. Worth deciding whether the interface should grow a batch slot
      or whether batch providers stay outside it.

notes: >-
  What this example is for. Diff it against stripe.spec.yaml. Everything present
  in one and absent in the other is a Stripe assumption the schema would have
  baked in as universal had it been designed against Stripe alone: the api and
  endpoints blocks, the webhooks block, synchronous status, and an HTTP base URL
  at all. The blocks that survive both — provider, integration, auth,
  idempotency, status_map, config_fields, lifecycle_hooks — are the parts that
  are genuinely universal.
